name: validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate shell scripts
        run: bash -n install.sh uninstall.sh manifest.sh

      - name: Validate package CLI
        run: |
          npm run help
          npm run pack:check

      - name: Test installer lifecycle
        run: bash ./tests/installer-smoke.sh

  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ["1.3.13", "1.3.14", "1.3.15", "1.3.16", "1.3.17", "1.4.0", "1.4.1", "1.14.20", "1.18.4"]

    steps:
      - uses: actions/checkout@v4

      - name: Load manifest
        id: manifest
        run: |
          source ./manifest.sh
          echo "tag=$(resolve_upstream_tag '${{ matrix.version }}')" >> "$GITHUB_OUTPUT"

      - name: Clone OpenCode
        run: git clone --depth 1 --branch "${{ steps.manifest.outputs.tag }}" https://github.com/anomalyco/opencode.git opencode-src

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Apply TPS auto-patch
        run: bun ./scripts/apply-opencode-tps-patch.mjs ./opencode-src "${{ matrix.version }}"

      - name: Install dependencies
        working-directory: opencode-src
        run: |
          source ../manifest.sh
          if [ "${{ matrix.version }}" = "$LATEST_TESTED" ]; then
            bun install --frozen-lockfile
          else
            bun install --no-save
          fi

      - name: Typecheck patched packages
        run: |
          bun --cwd ./opencode-src/packages/opencode run typecheck
          if [ -f ./opencode-src/packages/tui/package.json ]; then
            bun --cwd ./opencode-src/packages/tui run typecheck
          fi
